name: Tự động lấy dữ liệu Google Trends

on:
  schedule:
    # Chạy tự động lúc 00:00 UTC (tức 7:00 sáng giờ Việt Nam) mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Nút bấm giúp bạn có thể tự kích hoạt chạy bằng tay bất cứ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra mã nguồn (Checkout code)
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt các thư viện cần thiết
      run: |
        python -m pip install --upgrade pip
        pip install pytrends pandas requests

    - name: Chạy script lấy dữ liệu Trends
      run: python script.py

    - name: Tự động lưu file dữ liệu mới lên GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add *.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Cập nhật dữ liệu Trends ngày $(date +'%Y-%m-%d')" && git push)
